<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="rubyGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5E36"/>
      <stop offset="50%" stop-color="#E60039"/>
      <stop offset="100%" stop-color="#990026"/>
    </linearGradient>
    <linearGradient id="facetTop" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFA07A"/>
      <stop offset="100%" stop-color="#FF4500"/>
    </linearGradient>
    <linearGradient id="facetLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3366"/>
      <stop offset="100%" stop-color="#B3002D"/>
    </linearGradient>
    <linearGradient id="facetRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF6644"/>
      <stop offset="100%" stop-color="#80001A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark base backing -->
  <rect width="64" height="64" rx="14" fill="#050505"/>
  <rect width="64" height="64" rx="14" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

  <!-- Ambient glow behind gem -->
  <circle cx="32" cy="32" r="16" fill="#FF4500" opacity="0.3" filter="url(#glow)"/>

  <!-- Faceted Ruby Bug Emblem -->
  <!-- Top Table -->
  <polygon points="32,10 44,18 32,24 20,18" fill="url(#facetTop)"/>
  
  <!-- Upper Left Wing / Facet -->
  <polygon points="20,18 32,24 24,38 12,28" fill="url(#facetLeft)"/>
  
  <!-- Upper Right Wing / Facet -->
  <polygon points="32,24 44,18 52,28 40,38" fill="url(#facetRight)"/>
  
  <!-- Center Heart / Spine -->
  <polygon points="32,24 40,38 32,54 24,38" fill="url(#rubyGlow)"/>

  <!-- Lower Left Tip -->
  <polygon points="12,28 24,38 32,54 18,48" fill="#800020" opacity="0.9"/>

  <!-- Lower Right Tip -->
  <polygon points="52,28 40,38 32,54 46,48" fill="#590016" opacity="0.9"/>

  <!-- Bug Antennae / Modern Accents -->
  <path d="M25 14 L19 8 M39 14 L45 8" stroke="#FFA07A" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Crystal Facet Highlights -->
  <polyline points="20,18 32,24 44,18" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1"/>
  <line x1="32" y1="24" x2="32" y2="54" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
</svg>
