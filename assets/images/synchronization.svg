<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640">
  <title>Order information moving through an authorized API</title>
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a2540"/>
      <stop offset="1" stop-color="#1b3b66"/>
    </linearGradient>
    <filter id="ssh" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#041525" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="960" height="640" rx="24" fill="url(#sbg)"/>
  <text x="56" y="78" fill="#adbdcc" font-family="Segoe UI, Inter, sans-serif" font-size="14">In design</text>
  <text x="56" y="116" fill="#fff" font-family="Segoe UI, Inter, sans-serif" font-size="28" font-weight="400">Authorized sync path</text>
  <g filter="url(#ssh)">
    <rect x="56" y="168" width="240" height="300" rx="16" fill="#fff"/>
    <text x="80" y="212" fill="#425466" font-family="Segoe UI, Inter, sans-serif" font-size="13">Seller account</text>
    <text x="80" y="248" fill="#0a2540" font-family="Segoe UI, Inter, sans-serif" font-size="20" font-weight="500">Primary Store</text>
    <text x="80" y="300" fill="#0a2540" font-family="Segoe UI, Inter, sans-serif" font-size="15">Order 10021</text>
    <text x="80" y="332" fill="#0a2540" font-family="Segoe UI, Inter, sans-serif" font-size="15">Order 10018</text>
    <text x="80" y="364" fill="#0a2540" font-family="Segoe UI, Inter, sans-serif" font-size="15">Order 10014</text>
    <text x="80" y="420" fill="#425466" font-family="Segoe UI, Inter, sans-serif" font-size="13">Sample records</text>
  </g>
  <g filter="url(#ssh)">
    <rect x="360" y="220" width="240" height="196" rx="16" fill="#635bff"/>
    <text x="384" y="268" fill="#ddd9ff" font-family="Segoe UI, Inter, sans-serif" font-size="13">Platform API</text>
    <text x="384" y="308" fill="#fff" font-family="Segoe UI, Inter, sans-serif" font-size="20" font-weight="500">Approved</text>
    <text x="384" y="340" fill="#fff" font-family="Segoe UI, Inter, sans-serif" font-size="20" font-weight="500">permissions</text>
    <text x="384" y="380" fill="#ddd9ff" font-family="Segoe UI, Inter, sans-serif" font-size="13">Nothing beyond the grant</text>
  </g>
  <g filter="url(#ssh)">
    <rect x="664" y="168" width="240" height="300" rx="16" fill="#fff"/>
    <text x="688" y="212" fill="#425466" font-family="Segoe UI, Inter, sans-serif" font-size="13">RubyBug workspace</text>
    <text x="688" y="248" fill="#0a2540" font-family="Segoe UI, Inter, sans-serif" font-size="20" font-weight="500">One list</text>
    <text x="688" y="300" fill="#0a2540" font-family="Segoe UI, Inter, sans-serif" font-size="15">10021 · Primary</text>
    <text x="688" y="332" fill="#0a2540" font-family="Segoe UI, Inter, sans-serif" font-size="15">10018 · Second</text>
    <text x="688" y="364" fill="#0a2540" font-family="Segoe UI, Inter, sans-serif" font-size="15">10014 · Third</text>
    <text x="688" y="420" fill="#635bff" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="600">Not a live sync</text>
  </g>
  <path d="M300 318h56M604 318h56" stroke="#80e9ff" stroke-width="3" stroke-linecap="round"/>
</svg>
