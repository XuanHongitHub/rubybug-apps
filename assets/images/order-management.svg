<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640">
  <title>Centralized order table</title>
  <defs>
    <linearGradient id="obg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f9fc"/>
      <stop offset="1" stop-color="#e7f8ff"/>
    </linearGradient>
    <filter id="osh" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0a2540" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="960" height="640" rx="24" fill="url(#obg)"/>
  <g filter="url(#osh)">
    <rect x="48" y="48" width="864" height="544" rx="18" fill="#fff"/>
    <text x="80" y="100" fill="#0a2540" font-family="Segoe UI, Inter, sans-serif" font-size="22" font-weight="500">Orders across stores</text>
    <text x="80" y="128" fill="#425466" font-family="Segoe UI, Inter, sans-serif" font-size="14">Sample rows. Each record stays tied to its store.</text>
    <rect x="700" y="72" width="168" height="32" rx="16" fill="#ece9ff"/>
    <text x="724" y="93" fill="#635bff" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="600">Illustrative list</text>
    <text x="80" y="184" fill="#8898a9" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="600">Order</text>
    <text x="220" y="184" fill="#8898a9" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="600">Store</text>
    <text x="460" y="184" fill="#8898a9" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="600">Item</text>
    <text x="740" y="184" fill="#8898a9" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="600">Status</text>
    <line x1="80" y1="200" x2="880" y2="200" stroke="#e6ebf1"/>
    <text x="80" y="248" fill="#0a2540" font-family="Segoe UI, Inter, sans-serif" font-size="16">10021</text>
    <text x="220" y="248" fill="#0a2540" font-family="Segoe UI, Inter, sans-serif" font-size="16">Primary Store</text>
    <text x="460" y="248" fill="#425466" font-family="Segoe UI, Inter, sans-serif" font-size="16">Sample line</text>
    <circle cx="748" cy="242" r="5" fill="#635bff"/>
    <text x="764" y="248" fill="#0a2540" font-family="Segoe UI, Inter, sans-serif" font-size="16">Processing</text>
    <line x1="80" y1="272" x2="880" y2="272" stroke="#e6ebf1"/>
    <text x="80" y="320" fill="#0a2540" font-family="Segoe UI, Inter, sans-serif" font-size="16">10018</text>
    <text x="220" y="320" fill="#0a2540" font-family="Segoe UI, Inter, sans-serif" font-size="16">Second Store</text>
    <text x="460" y="320" fill="#425466" font-family="Segoe UI, Inter, sans-serif" font-size="16">Sample line</text>
    <circle cx="748" cy="314" r="5" fill="#15be53"/>
    <text x="764" y="320" fill="#0a2540" font-family="Segoe UI, Inter, sans-serif" font-size="16">Fulfilled</text>
    <line x1="80" y1="344" x2="880" y2="344" stroke="#e6ebf1"/>
    <text x="80" y="392" fill="#0a2540" font-family="Segoe UI, Inter, sans-serif" font-size="16">10014</text>
    <text x="220" y="392" fill="#0a2540" font-family="Segoe UI, Inter, sans-serif" font-size="16">Third Store</text>
    <text x="460" y="392" fill="#425466" font-family="Segoe UI, Inter, sans-serif" font-size="16">Sample line</text>
    <circle cx="748" cy="386" r="5" fill="#0a2540"/>
    <text x="764" y="392" fill="#0a2540" font-family="Segoe UI, Inter, sans-serif" font-size="16">Needs review</text>
    <line x1="80" y1="416" x2="880" y2="416" stroke="#e6ebf1"/>
    <text x="80" y="464" fill="#0a2540" font-family="Segoe UI, Inter, sans-serif" font-size="16">10011</text>
    <text x="220" y="464" fill="#0a2540" font-family="Segoe UI, Inter, sans-serif" font-size="16">Primary Store</text>
    <text x="460" y="464" fill="#425466" font-family="Segoe UI, Inter, sans-serif" font-size="16">Sample line</text>
    <circle cx="748" cy="458" r="5" fill="#635bff"/>
    <text x="764" y="464" fill="#0a2540" font-family="Segoe UI, Inter, sans-serif" font-size="16">Processing</text>
    <line x1="80" y1="488" x2="880" y2="488" stroke="#e6ebf1"/>
    <text x="80" y="536" fill="#425466" font-family="Segoe UI, Inter, sans-serif" font-size="14">Only fields returned by an authorized integration can appear here.</text>
  </g>
</svg>
