<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420">
  <title>Intended RubyBug Apps workflow</title>
  <defs>
    <linearGradient id="wbg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#efeaff"/>
      <stop offset="0.5" stop-color="#f6f9fc"/>
      <stop offset="1" stop-color="#e5f7ff"/>
    </linearGradient>
    <filter id="wsh" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0a2540" flood-opacity="0.1"/>
    </filter>
  </defs>
  <rect width="1200" height="420" rx="24" fill="url(#wbg)"/>
  <g filter="url(#wsh)">
    <rect x="36" y="70" width="210" height="250" rx="16" fill="#fff"/>
    <text x="56" y="112" fill="#635bff" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="600">01</text>
    <text x="56" y="152" fill="#0a2540" font-family="Segoe UI, Inter, sans-serif" font-size="20" font-weight="500">Connect</text>
    <text x="56" y="196" fill="#425466" font-family="Segoe UI, Inter, sans-serif" font-size="14">Merchant starts</text>
    <text x="56" y="218" fill="#425466" font-family="Segoe UI, Inter, sans-serif" font-size="14">a store link</text>
  </g>
  <g filter="url(#wsh)">
    <rect x="270" y="70" width="210" height="250" rx="16" fill="#fff"/>
    <text x="290" y="112" fill="#635bff" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="600">02</text>
    <text x="290" y="152" fill="#0a2540" font-family="Segoe UI, Inter, sans-serif" font-size="20" font-weight="500">Authorize</text>
    <text x="290" y="196" fill="#425466" font-family="Segoe UI, Inter, sans-serif" font-size="14">Permissions are</text>
    <text x="290" y="218" fill="#425466" font-family="Segoe UI, Inter, sans-serif" font-size="14">reviewed</text>
  </g>
  <g filter="url(#wsh)">
    <rect x="504" y="70" width="210" height="250" rx="16" fill="#635bff"/>
    <text x="524" y="112" fill="#ddd9ff" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="600">03</text>
    <text x="524" y="152" fill="#fff" font-family="Segoe UI, Inter, sans-serif" font-size="20" font-weight="500">Sync</text>
    <text x="524" y="196" fill="#efeaff" font-family="Segoe UI, Inter, sans-serif" font-size="14">Supported order</text>
    <text x="524" y="218" fill="#efeaff" font-family="Segoe UI, Inter, sans-serif" font-size="14">fields only</text>
  </g>
  <g filter="url(#wsh)">
    <rect x="738" y="70" width="210" height="250" rx="16" fill="#fff"/>
    <text x="758" y="112" fill="#635bff" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="600">04</text>
    <text x="758" y="152" fill="#0a2540" font-family="Segoe UI, Inter, sans-serif" font-size="20" font-weight="500">Review</text>
    <text x="758" y="196" fill="#425466" font-family="Segoe UI, Inter, sans-serif" font-size="14">One workspace</text>
    <text x="758" y="218" fill="#425466" font-family="Segoe UI, Inter, sans-serif" font-size="14">for the day</text>
  </g>
  <g filter="url(#wsh)">
    <rect x="972" y="70" width="192" height="250" rx="16" fill="#0a2540"/>
    <text x="992" y="112" fill="#80e9ff" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="600">05</text>
    <text x="992" y="152" fill="#fff" font-family="Segoe UI, Inter, sans-serif" font-size="20" font-weight="500">Operate</text>
    <text x="992" y="196" fill="#adbdcc" font-family="Segoe UI, Inter, sans-serif" font-size="14">Still being</text>
    <text x="992" y="218" fill="#adbdcc" font-family="Segoe UI, Inter, sans-serif" font-size="14">developed</text>
  </g>
  <text x="36" y="372" fill="#425466" font-family="Segoe UI, Inter, sans-serif" font-size="14">Illustrative sequence. Not a live connection.</text>
</svg>
