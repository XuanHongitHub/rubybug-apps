<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640">
  <title>Connected stores in one workspace</title>
  <defs>
    <linearGradient id="mbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efeaff"/>
      <stop offset="1" stop-color="#f6f9fc"/>
    </linearGradient>
    <filter id="msh" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#0a2540" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="960" height="640" rx="24" fill="url(#mbg)"/>
  <g filter="url(#msh)">
    <rect x="48" y="56" width="560" height="528" rx="18" fill="#fff"/>
    <text x="76" y="104" fill="#0a2540" font-family="Segoe UI, Inter, sans-serif" font-size="22" font-weight="500">Connected stores</text>
    <text x="76" y="132" fill="#425466" font-family="Segoe UI, Inter, sans-serif" font-size="14">One list for authorized seller accounts</text>
    <rect x="76" y="164" width="504" height="112" rx="14" fill="#f6f9fc"/>
    <circle cx="112" cy="220" r="16" fill="#635bff"/>
    <text x="144" y="212" fill="#0a2540" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="600">Primary Store</text>
    <text x="144" y="236" fill="#425466" font-family="Segoe UI, Inter, sans-serif" font-size="13">Seller account · Authorized</text>
    <circle cx="530" cy="220" r="6" fill="#15be53"/>
    <rect x="76" y="292" width="504" height="112" rx="14" fill="#fff" stroke="#e6ebf1"/>
    <circle cx="112" cy="348" r="16" fill="#0a2540"/>
    <text x="144" y="340" fill="#0a2540" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="600">Second Store</text>
    <text x="144" y="364" fill="#425466" font-family="Segoe UI, Inter, sans-serif" font-size="13">Seller account · Authorized</text>
    <circle cx="530" cy="348" r="6" fill="#15be53"/>
    <rect x="76" y="420" width="504" height="112" rx="14" fill="#fff" stroke="#e6ebf1"/>
    <circle cx="112" cy="476" r="16" fill="#80e9ff"/>
    <text x="144" y="468" fill="#0a2540" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="600">Third Store</text>
    <text x="144" y="492" fill="#425466" font-family="Segoe UI, Inter, sans-serif" font-size="13">Seller account · Pending setup</text>
    <circle cx="530" cy="476" r="6" fill="#635bff"/>
  </g>
  <g filter="url(#msh)">
    <rect x="640" y="120" width="260" height="220" rx="16" fill="#0a2540"/>
    <text x="664" y="164" fill="#adbdcc" font-family="Segoe UI, Inter, sans-serif" font-size="13">Instead of</text>
    <text x="664" y="198" fill="#fff" font-family="Segoe UI, Inter, sans-serif" font-size="20" font-weight="500">Three separate</text>
    <text x="664" y="226" fill="#fff" font-family="Segoe UI, Inter, sans-serif" font-size="20" font-weight="500">store logins</text>
    <text x="664" y="280" fill="#adbdcc" font-family="Segoe UI, Inter, sans-serif" font-size="13">Sample comparison</text>
  </g>
  <g filter="url(#msh)">
    <rect x="640" y="364" width="260" height="160" rx="16" fill="#fff"/>
    <text x="664" y="408" fill="#425466" font-family="Segoe UI, Inter, sans-serif" font-size="13">Workspace</text>
    <text x="664" y="444" fill="#0a2540" font-family="Segoe UI, Inter, sans-serif" font-size="18" font-weight="500">One roster</text>
    <text x="664" y="476" fill="#425466" font-family="Segoe UI, Inter, sans-serif" font-size="13">In design</text>
  </g>
</svg>
