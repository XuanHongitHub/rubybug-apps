<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460">
  <title>A sample day across connected stores</title>
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f9fc"/>
      <stop offset="1" stop-color="#efeaff"/>
    </linearGradient>
    <filter id="psh" x="-20%" y="-30%" width="150%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#0a2540" flood-opacity="0.1"/>
    </filter>
  </defs>
  <rect width="1200" height="460" rx="24" fill="url(#pbg)"/>
  <g filter="url(#psh)">
    <rect x="36" y="48" width="360" height="340" rx="16" fill="#fff"/>
    <text x="60" y="96" fill="#425466" font-family="Segoe UI, Inter, sans-serif" font-size="14">Less manual work</text>
    <text x="60" y="140" fill="#0a2540" font-family="Segoe UI, Inter, sans-serif" font-size="28" font-weight="400">One list</text>
    <text x="60" y="176" fill="#0a2540" font-family="Segoe UI, Inter, sans-serif" font-size="28" font-weight="400">instead of three</text>
    <text x="60" y="240" fill="#425466" font-family="Segoe UI, Inter, sans-serif" font-size="15">Sample orders gathered</text>
    <text x="60" y="268" fill="#425466" font-family="Segoe UI, Inter, sans-serif" font-size="15">after authorization.</text>
    <rect x="60" y="312" width="120" height="32" rx="16" fill="#ece9ff"/>
    <text x="78" y="333" fill="#635bff" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="600">In design</text>
  </g>
  <g filter="url(#psh)">
    <rect x="420" y="48" width="360" height="340" rx="16" fill="#0a2540"/>
    <text x="444" y="96" fill="#adbdcc" font-family="Segoe UI, Inter, sans-serif" font-size="14">Visibility</text>
    <text x="444" y="148" fill="#fff" font-family="Segoe UI, Inter, sans-serif" font-size="42" font-weight="300">18</text>
    <text x="444" y="184" fill="#adbdcc" font-family="Segoe UI, Inter, sans-serif" font-size="15">orders in the sample view</text>
    <text x="444" y="248" fill="#fff" font-family="Segoe UI, Inter, sans-serif" font-size="42" font-weight="300">2</text>
    <text x="444" y="284" fill="#adbdcc" font-family="Segoe UI, Inter, sans-serif" font-size="15">marked for review</text>
  </g>
  <g filter="url(#psh)">
    <rect x="804" y="48" width="360" height="340" rx="16" fill="#fff"/>
    <text x="828" y="96" fill="#425466" font-family="Segoe UI, Inter, sans-serif" font-size="14">Organized growth</text>
    <text x="828" y="148" fill="#0a2540" font-family="Segoe UI, Inter, sans-serif" font-size="20" font-weight="500">Add a store</text>
    <text x="828" y="176" fill="#425466" font-family="Segoe UI, Inter, sans-serif" font-size="14">as its own connection</text>
    <line x1="828" y1="208" x2="1100" y2="208" stroke="#e6ebf1"/>
    <text x="828" y="252" fill="#0a2540" font-family="Segoe UI, Inter, sans-serif" font-size="20" font-weight="500">Keep the roster</text>
    <text x="828" y="280" fill="#425466" font-family="Segoe UI, Inter, sans-serif" font-size="14">when operations expand</text>
    <text x="828" y="340" fill="#635bff" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="600">Sample layout</text>
  </g>
</svg>
