<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 52" width="210" height="52">
  <defs>
    <linearGradient id="logoRubyGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5E36"/>
      <stop offset="50%" stop-color="#E60039"/>
      <stop offset="100%" stop-color="#990026"/>
    </linearGradient>
    <linearGradient id="logoFacetTop" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFA07A"/>
      <stop offset="100%" stop-color="#FF4500"/>
    </linearGradient>
    <linearGradient id="logoFacetLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3366"/>
      <stop offset="100%" stop-color="#B3002D"/>
    </linearGradient>
    <linearGradient id="logoFacetRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF6644"/>
      <stop offset="100%" stop-color="#80001A"/>
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Icon Mark Container -->
  <g transform="translate(4, 2)">
    <rect width="48" height="48" rx="12" fill="#0A0A0A"/>
    <rect width="48" height="48" rx="12" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    
    <!-- Ambient glow -->
    <circle cx="24" cy="24" r="12" fill="#FF4500" opacity="0.35" filter="url(#logoGlow)"/>

    <!-- Faceted Gemstone Bug -->
    <g transform="translate(24, 24) scale(0.7) translate(-32, -32)">
      <polygon points="32,10 44,18 32,24 20,18" fill="url(#logoFacetTop)"/>
      <polygon points="20,18 32,24 24,38 12,28" fill="url(#logoFacetLeft)"/>
      <polygon points="32,24 44,18 52,28 40,38" fill="url(#logoFacetRight)"/>
      <polygon points="32,24 40,38 32,54 24,38" fill="url(#logoRubyGlow)"/>
      <polygon points="12,28 24,38 32,54 18,48" fill="#800020" opacity="0.9"/>
      <polygon points="52,28 40,38 32,54 46,48" fill="#590016" opacity="0.9"/>
      <path d="M25 14 L19 8 M39 14 L45 8" stroke="#FFA07A" stroke-width="2" stroke-linecap="round"/>
      <polyline points="20,18 32,24 44,18" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="1"/>
      <line x1="32" y1="24" x2="32" y2="54" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
    </g>
  </g>

  <!-- Clean Typography: wide viewBox prevents clipping of 'g' -->
  <g transform="translate(62, 0)">
    <text x="0" y="33" fill="#FFFFFF" font-family="'Playfair Display', Georgia, serif" font-size="24" font-weight="600" letter-spacing="-0.5">RubyBug</text>
  </g>
</svg>
